name: campuspool
description: "CampusPool — campus commute coordination platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core & UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Routing
  go_router: ^13.2.0
  
  # Networking
  dio: ^5.4.3
  
  # Storage & Cache
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Location & Permission
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  
  # Media & Images
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  
  # Utils
  timeago: ^3.6.1
  intl: ^0.19.0
  socket_io_client: ^3.1.6
  hive_flutter: ^1.1.0
  flutter_map_tile_caching: ^9.0.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  uuid: ^4.5.3
  flutter_map_marker_cluster: ^1.3.6
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
